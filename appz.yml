app:
    name: prometheus
    code: prometheus
    notify: appzdev@cloudbourne.com

build:
    version: 2.54
    env: PROD
    build_file: none
    output_files: output/*.zip
    image_template: prometheus-2.54

deploy:
    context: alpha/PROD
    type: statefulset
    replicas: 1
    port:
    - 9090

volumes:
  - claim: prometheus-data
    class: linode-block-storage
    mount: /appz/data
    name: data
    size: 50Gi
    matchLabels: false
    
  
properties:
    revision : 1
    

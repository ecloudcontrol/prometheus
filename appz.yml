app:
    name: prometheus
    code: prometheus
    notify: appzdev@cloudbourne.com

build:
    version: 3.0
    env: PROD
    build_file: none
    output_files: output/*.zip
    image_template: prometheus-3.4

deploy:
    context: alpha/PROD
    type: statefulset
    replicas: 1
    port:
    - 9090
    nodeSelector:
      nodepool: toplist
    tolerations:
      - key: nodepool
        operator: Equal
        value: toplist
        effect: NoSchedule

volumes:
  - claim: prometheus-data
    mount: /appz/data
    name: data
    size: 50Gi
    matchLabels: false
    
  
properties:
    revision : 5

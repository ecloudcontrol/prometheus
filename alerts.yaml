groups:

- name: system-health
  rules:
    - alert: HostHighCpuLoad
      expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) > 90
      for: 3m
      labels:
        severity: warning
      annotations:
        summary: Host high CPU load (instance {{ $labels.instance }})
        description: "CPU load > 90%\nVALUE = {{ $value }}"

    - alert: LowDataDiskSpace
      expr: ceil(((node_filesystem_size_bytes{mountpoint!="/boot"} - node_filesystem_free_bytes{mountpoint!="/boot"}) / node_filesystem_size_bytes{mountpoint!="/boot"} * 100)) > 95
      labels:
        severity: critical
      annotations:
        summary: "Low disk space on {{ $labels.instance }}"
        description: "Partition: {{ $labels.mountpoint }}, Usage: {{ humanize $value }}%"

    - alert: HostOutOfMemory
      expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes * 100 < 8
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: Host out of memory (instance {{ $labels.instance }})
        description: "Available memory < 8%\nVALUE = {{ $value }}"

    - alert: HostOutOfDiskSpace
      expr: (node_filesystem_avail_bytes * 100) / node_filesystem_size_bytes < 10 and ON(instance, device, mountpoint) node_filesystem_readonly == 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Low disk space (instance {{ $labels.instance }})
        description: "Disk space < 10%\nAvailable = {{ $value }}%"

    - alert: HighNodeCPU
      expr: rate(node_load15[5m]) * 100 > 80
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: High 15m CPU load ({{ $labels.instance }})
        description: "Load average > 80%\nVALUE = {{ $value }}"

- name: network-probes
  rules:
    - alert: SiteDown
      expr: probe_success == 0
      for: 30s
      labels:
        severity: critical
      annotations:
        summary: "Site down: {{ $labels.instance }}"
        description: "Blackbox TCP probe failed (possibly VPN or network down)"

    - alert: HTTP200Fail
      expr: probe_http_status_code != 200
      for: 10s
      labels:
        severity: critical
      annotations:
        summary: "HTTP 200 check failed"
        description: "Expected HTTP 200, got {{ $value }} from {{ $labels.instance }}"

    - alert: MySQLPortDown
      expr: probe_success{instance=~"mysql-.*"} == 0
      for: 10s
      labels:
        severity: critical
      annotations:
        summary: "MySQL down on {{ $labels.instance }}"
        description: "TCP connection to MySQL port 3306 failed (likely VPN issue)"

- name: PVC-usage
  rules:
  - alert: PVCHighUsage
    expr: (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) * 100 > 70
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: PVC high usage (namespace {{ $labels.namespace }}, claim {{ $labels.persistentvolumeclaim }})
      description: |-
        Description: PVC usage > 70%
        VALUE = {{ $value }}%

- name: MySQL-ReplicaDown
  rules:
  - alert: MySQLReplicaDown
    expr: mysql_up == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "MySQL Replica Down (instance {{ $labels.instance }})"
      description: "The MySQL exporter or replica is unreachable.\nVALUE = {{ $value }}\nLABELS = {{ $labels }}"

- name: MySQL-SlaveIOThreadDown
  rules:
  - alert: MySQLSlaveIOThreadDown
    expr: mysql_slave_status_slave_io_running == 0
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: "MySQL Slave IO Thread stopped (instance {{ $labels.instance }})"
      description: "Replication IO thread stopped on slave {{ $labels.instance }}.\nVALUE = {{ $value }}"

- name: MySQL-SlaveSQLThreadDown
  rules:
  - alert: MySQLSlaveSQLThreadDown
    expr: mysql_slave_status_slave_sql_running == 0
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: "MySQL Slave SQL Thread stopped (instance {{ $labels.instance }})"
      description: "Replication SQL thread stopped on slave {{ $labels.instance }}.\nVALUE = {{ $value }}"

- name: MySQL-ReplicationLagHigh
  rules:
  - alert: MySQLReplicationLagHigh
    expr: mysql_slave_status_seconds_behind_master > 60
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "MySQL Replication Lag High (instance {{ $labels.instance }})"
      description: "Replication lag is {{ $value }} seconds.\nSlave is falling behind master.\nLABELS = {{ $labels }}"

- name: MySQL-ReplicationError
  rules:
  - alert: MySQLReplicationError
    expr: mysql_slave_status_last_errno > 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "MySQL Replication Error (instance {{ $labels.instance }})"
      description: "Replication stopped due to an error on slave {{ $labels.instance }}.\nError code: {{ $value }}\nLABELS = {{ $labels }}"

- name: MySQL-SlaveNotConnected
  rules:
  - alert: MySQLSlaveNotConnected
    expr: mysql_slave_status_slave_io_running == 0 or mysql_slave_status_slave_sql_running == 0
    for: 3m
    labels:
      severity: critical
    annotations:
      summary: "MySQL Slave Disconnected (instance {{ $labels.instance }})"
      description: "Slave {{ $labels.instance }} lost connection or replication stopped.\nEither IO or SQL thread is not running.\nLABELS = {{ $labels }}"


- name: MySQL-BinlogGrowingFast
  rules:
  - alert: MySQLBinlogGrowingFast
    expr: rate(mysql_binlog_size_bytes[10m]) > 50000000
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: "MySQL Binlog Growing Fast (instance {{ $labels.instance }})"
      description: "Binlog size increasing more than 50 MB per 10 minutes.\nCheck binlog retention.\nLABELS = {{ $labels }}"


- name: Kafka-BrokerDown
  rules:
  - alert: KafkaBrokerDown
    expr: count(kafka_broker_info) < max(kafka_broker_info)
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: "Kafka Broker Down"
      description: "One or more brokers are down or unreachable."

- name: Kafka-UnderReplicated
  rules:
  - alert: KafkaUnderReplicatedPartitions
    expr: sum(kafka_topic_partition_replicas - kafka_topic_partition_in_sync_replica) > 0
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: "Kafka Under Replicated Partitions"
      description: "Some partitions do not have enough in-sync replicas (ISR < Replicas)."

- name: Kafka-OfflinePartitions
  rules:
  - alert: KafkaOfflinePartitions
    expr: sum(kafka_topic_partition_leader == -1) > 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "Kafka Offline Partitions"
      description: "No leader for some partitions. Reads/Writes blocked."

- name: Kafka-HighLag
  rules:
  - alert: KafkaHighConsumerLag
    expr: sum(kafka_consumergroup_lag{topic!="__consumer_offsets"}) > 20
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "High Kafka Consumer Lag"
      description: "Consumers are falling behind. Total lag: {{ $value }} messages."

- name: Kafka-ConsumerStalled
  rules:
  - alert: KafkaStalledConsumerGroup
    expr: |
      sum(kafka_consumergroup_lag{topic!="__consumer_offsets"}) > 50
      and rate(kafka_consumergroup_current_offset[5m]) <= 0
    for: 10m
    labels:
      severity: critical
    annotations:
      summary: "Kafka Consumer Group Stalled"
      description: "Offsets not increasing for 10 minutes while lag is high."

- name: MariaDB-Health
  rules:

  - alert: MariaDBDown
    expr: mysql_up{job=~"mariadb-*-exporter"} == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "MariaDB Down ({{ $labels.instance }})"
      description: "MariaDB instance or exporter is unreachable."

  - alert: MariaDBReplicationSLAUnhealthy
    expr: |
      (mysql_up{job=~"mariadb-*-exporter"} == 0)
      OR (mysql_slave_status_slave_io_running{job="mariadb-slave-exporter"} == 0)
      OR (mysql_slave_status_slave_sql_running{job="mariadb-slave-exporter"} == 0)
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: "MariaDB Replication SLA Unhealthy"
      description: |
        Replication issue detected:
        - Exporter down
        - IO Thread stopped
        - SQL Thread stopped

  - alert: MariaDBSlaveDisconnected
    expr: mysql_global_status_slaves_connected{job="mariadb-master-exporter"} == 0
    for: 3m
    labels:
      severity: critical
    annotations:
      summary: "MariaDB Slave Disconnected ({{ $labels.instance }})"
      description: "Slave is no longer connected to the Master."

  - alert: MariaDBReplicationLagHigh
    expr: mysql_slave_status_seconds_behind_master{job="mariadb-slave-exporter"} > 60
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: "MariaDB Replication Lag High ({{ $labels.instance }})"
      description: |
        Slave is {{ $value }} seconds behind master.

  - alert: MariaDBReplicationError
    expr: mysql_slave_status_last_errno{job="mariadb-slave-exporter"} > 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "MariaDB Replication SQL Error ({{ $labels.instance }})"
      description: |
        SQL thread encountered an error. Code: {{ $value }}

  - alert: MariaDBMasterReadOnlyEnabled
    expr: mysql_global_variables_read_only{job="mariadb-master-exporter"} == 1
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "MariaDB Master in Read-Only Mode ({{ $labels.instance }})"
      description: |
        Master entered read-only mode — Writes will fail.

- name: Kafka-JVMHighHeap
  rules:
  - alert: KafkaHighJVMHeapUsage
    expr: (jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"}) * 100 > 80
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Kafka JVM Heap Usage High"
      description: "Heap usage is above 80% for {{ $labels.instance }}. Current usage: {{ $value }}%"

- name: Kafka-JVMHeapCritical
  rules:
  - alert: KafkaJVMHeapCritical
    expr: (jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"}) * 100 > 90
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: "Kafka JVM Heap Critical"
      description: "Heap nearing full on {{ $labels.instance }}. May cause OOM or GC pauses."

- name: Kafka-ThreadLeak
  rules:
  - alert: KafkaHighThreadCount
    expr: jvm_threads_count > 300
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Kafka Thread Count High"
      description: "Thread count increased abnormally on {{ $labels.instance }}. May indicate thread leak."

- name: Kafka-HighMemoryUsage
  rules:
  - alert: KafkaHighMemoryUsage
    expr: process_resident_memory_bytes / 8e+9 * 100 > 90
    for: 10m
    labels:
      severity: critical
    annotations:
      summary: "Kafka Memory Usage Critical"
      description: "Kafka broker memory usage >90% on {{ $labels.instance }}."

- name: Kafka-HighCPU
  rules:
  - alert: KafkaHighCPUUsage
    expr: rate(process_cpu_seconds_total[5m]) * 100 > 80
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: "Kafka CPU Usage High"
      description: "CPU usage above 80% for {{ $labels.instance }}."

- name: Kafka-GCHigh
  rules:
  - alert: KafkaHighGCPause
    expr: rate(jvm_gc_collection_seconds_sum[5m]) > 0.2
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Kafka GC Pause Time High"
      description: "GC pause time >200ms/sec on {{ $labels.instance }} — may cause latency spikes."

- name: Kafka-NoController
  rules:
  - alert: KafkaNoActiveController
    expr: kafka_controller_activecontrollercount != 1
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "Kafka Active Controller Missing"
      description: "No Active Controller detected — cluster will not elect leaders!"

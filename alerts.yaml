groups:

- name: system-health
  rules:
    - alert: HostHighCpuLoad
      expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Host high CPU load (instance {{ $labels.instance }})
        description: "CPU load > 90%\nVALUE = {{ $value }}"

    - alert: LowDataDiskSpace
      expr: ceil(((node_filesystem_size_bytes{mountpoint!="/boot"} - node_filesystem_free_bytes{mountpoint!="/boot"}) / node_filesystem_size_bytes{mountpoint!="/boot"} * 100)) > 95
      labels:
        severity: critical
      annotations:
        summary: "Low disk space on {{ $labels.instance }}"
        description: "Partition: {{ $labels.mountpoint }}, Usage: {{ humanize $value }}%"

    - alert: HostOutOfMemory
      expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes * 100 < 8
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: Host out of memory (instance {{ $labels.instance }})
        description: "Available memory < 8%\nVALUE = {{ $value }}"

    - alert: HostOutOfDiskSpace
      expr: (node_filesystem_avail_bytes * 100) / node_filesystem_size_bytes < 10 and ON(instance, device, mountpoint) node_filesystem_readonly == 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Low disk space (instance {{ $labels.instance }})
        description: "Disk space < 10%\nAvailable = {{ $value }}%"

    - alert: HighNodeCPU
      expr: rate(node_load15[5m]) * 100 > 90
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: High 15m CPU load ({{ $labels.instance }})
        description: "Load average > 90%\nVALUE = {{ $value }}"

- name: network-probes
  rules:
    - alert: SiteDown
      expr: probe_success == 0
      for: 30s
      labels:
        severity: critical
      annotations:
        summary: "Site down: {{ $labels.instance }}"
        description: "Blackbox TCP probe failed (possibly VPN or network down)"

    - alert: HTTP200Fail
      expr: probe_http_status_code != 200
      for: 10s
      labels:
        severity: critical
      annotations:
        summary: "HTTP 200 check failed"
        description: "Expected HTTP 200, got {{ $value }} from {{ $labels.instance }}"

    - alert: MySQLPortDown
      expr: probe_success{instance=~"mysql-.*"} == 0
      for: 10s
      labels:
        severity: critical
      annotations:
        summary: "MySQL down on {{ $labels.instance }}"
        description: "TCP connection to MySQL port 3306 failed (likely VPN issue)"

- name: PVC-usage
  rules:
    - alert: PVCHighUsage
      expr: (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) * 100 > 80
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: PVC high usage (namespace {{ $labels.namespace }}, claim {{ $labels.persistentvolumeclaim }})
        description: |-
          Description: PVC usage > 80%
          VALUE = {{ $value }}%

# -----------------------------
# Windows Alerts Section
# -----------------------------

- name: Windows-CPU-Usage
  rules:
    - alert: WindowsHighCpuUsage
      expr: 100 - (sum by (instance) (rate(windows_cpu_time_total{mode="idle"}[2m])) / count by (instance)(windows_cpu_time_total{mode="idle"}) * 100) > 95
      for: 3m
      labels:
        severity: warning
      annotations:
        summary: High CPU usage on Windows Server (instance {{ $labels.instance }})
        description: "CPU usage is > 95% for more than 3 minutes.\n  VALUE = {{ $value | printf \"%.2f\" }}%\n  LABELS = {{ $labels }}"
        host: "{{ $labels.instance }}"
        title: "High CPU Usage"

- name: Windows-Memory-Usage
  rules:
    - alert: WindowsLowMemory
      expr: (windows_os_physical_memory_free_bytes / windows_os_visible_memory_bytes * 100) < 10
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: Low memory on Windows Server (instance {{ $labels.instance }})
        description: "Available memory is < 10% of total memory.\n  VALUE = {{ $value | printf \"%.2f\" }}%\n  LABELS = {{ $labels }}"
        host: "{{ $labels.instance }}"
        title: "Low Memory"

- name: Windows-Disk-Usage
  rules:
    - alert: WindowsLowDiskSpace
      expr: (windows_logical_disk_free_bytes / windows_logical_disk_size_bytes * 100) < 15
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: Low disk space on Windows Server (instance {{ $labels.instance }})
        description: "Disk space is < 15% on volume {{ $labels.volume }}.\n  Available Space = {{ $value | printf \"%.2f\" }}%\n  LABELS = {{ $labels }}"
        host: "{{ $labels.instance }}"
        title: "Low Disk Space"

    - alert: WindowsHighDiskLatency
      expr: rate(windows_logical_disk_read_write_latency_seconds_total[5m]) > 0.1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: High disk latency on Windows Server (instance {{ $labels.instance }})
        description: "Average disk read/write latency is > 100ms on volume {{ $labels.volume }}.\n  VALUE = {{ $value | printf \"%.3f\" }} seconds\n  LABELS = {{ $labels }}"
        host: "{{ $labels.instance }}"
        title: "High Disk Latency"

- name: Windows-Network-Usage
  rules:
    - alert: WindowsHighNetworkUsage
      expr: rate(windows_net_bytes_total{nic="Amazon_Elastic_Network_Adapter"}[5m]) > 10000000
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: High network usage on Windows Server (instance {{ $labels.instance }})
        description: "Network usage exceeds 10MB/s on interface {{ $labels.nic }}.\n  VALUE = {{ $value | printf \"%.2f\" }} bytes/s\n  LABELS = {{ $labels }}"
        host: "{{ $labels.instance }}"
        title: "High Network Usage"

    - alert: WindowsNetworkErrors
      expr: rate(windows_net_packets_received_errors_total{nic="Amazon_Elastic_Network_Adapter"}[5m]) > 0 or rate(windows_net_packets_outbound_errors_total{nic="Amazon_Elastic_Network_Adapter"}[5m]) > 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: Network errors detected on Windows Server (instance {{ $labels.instance }})
        description: "Network errors detected on interface {{ $labels.nic }}.\n  LABELS = {{ $labels }}"
        host: "{{ $labels.instance }}"
        title: "Network Errors"

- name: Windows-Availability
  rules:
    - alert: WindowsServerDown
      expr: up{job="windows_server"} == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Windows Server DOWN (instance {{ $labels.instance }})"
        description: "Windows exporter is not reachable. Server may have rebooted or crashed."
        host: "{{ $labels.instance }}"
        title: "Windows Server Down"

    - alert: WindowsUnexpectedReboot
      expr: changes(windows_system_boot_time_seconds[10m]) > 0
      labels:
        severity: critical
      annotations:
        summary: "Windows Server Rebooted (instance {{ $labels.instance }})"
        description: "Windows system reboot detected within last 10 minutes."

- name: MySQL-ReplicaDown
  rules:
    - alert: MySQLReplicaDown
      expr: mysql_up == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "MySQL Replica Down (instance {{ $labels.instance }})"
        description: "The MySQL exporter or replica is unreachable.\nVALUE = {{ $value }}\nLABELS = {{ $labels }}"

- name: MySQL-SlaveIOThreadDown
  rules:
    - alert: MySQLSlaveIOThreadDown
      expr: mysql_slave_status_slave_io_running == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "MySQL Slave IO Thread stopped (instance {{ $labels.instance }})"
        description: "Replication IO thread stopped on slave {{ $labels.instance }}.\nVALUE = {{ $value }}"

- name: MySQL-SlaveSQLThreadDown
  rules:
    - alert: MySQLSlaveSQLThreadDown
      expr: mysql_slave_status_slave_sql_running == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "MySQL Slave SQL Thread stopped (instance {{ $labels.instance }})"
        description: "Replication SQL thread stopped on slave {{ $labels.instance }}.\nVALUE = {{ $value }}"

- name: MySQL-ReplicationLagHigh
  rules:
    - alert: MySQLReplicationLagHigh
      expr: mysql_slave_status_seconds_behind_master > 60
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "MySQL Replication Lag High (instance {{ $labels.instance }})"
        description: "Replication lag is {{ $value }} seconds.\nSlave is falling behind master.\nLABELS = {{ $labels }}"

- name: MySQL-ReplicationError
  rules:
    - alert: MySQLReplicationError
      expr: mysql_slave_status_last_errno > 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "MySQL Replication Error (instance {{ $labels.instance }})"
        description: "Replication stopped due to an error on slave {{ $labels.instance }}.\nError code: {{ $value }}\nLABELS = {{ $labels }}"

- name: MySQL-SlaveNotConnected
  rules:
    - alert: MySQLSlaveNotConnected
      expr: mysql_slave_status_slave_io_running == 0 or mysql_slave_status_slave_sql_running == 0
      for: 3m
      labels:
        severity: critical
      annotations:
        summary: "MySQL Slave Disconnected (instance {{ $labels.instance }})"
        description: "Slave {{ $labels.instance }} lost connection or replication stopped.\nEither IO or SQL thread is not running.\nLABELS = {{ $labels }}"

- name: MySQL-BinlogGrowingFast
  rules:
    - alert: MySQLBinlogGrowingFast
      expr: rate(mysql_binlog_size_bytes[10m]) > 50000000
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "MySQL Binlog Growing Fast (instance {{ $labels.instance }})"
        description: "Binlog size increasing more than 50 MB per 10 minutes.\nCheck binlog retention.\nLABELS = {{ $labels }}"

- name: Kafka-BrokerDown
  rules:
  - alert: KafkaBrokerDown
    expr: count by () (max by (id) (kafka_broker_info)) < 3
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: "Kafka Broker Down"
      description: "One or more brokers are down or unreachable."

- name: Kafka-UnderReplicated
  rules:
  - alert: KafkaUnderReplicatedPartitions
    expr: sum(kafka_topic_partition_replicas - kafka_topic_partition_in_sync_replica) > 0
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: "Kafka Under Replicated Partitions"
      description: "Some partitions do not have enough in-sync replicas (ISR < Replicas)."

- name: Kafka-OfflinePartitions
  rules:
  - alert: KafkaOfflinePartitions
    expr: sum(kafka_topic_partition_leader == -1) > 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "Kafka Offline Partitions"
      description: "No leader for some partitions. Reads/Writes blocked."

- name: Kafka-HighLag
  rules:
  - alert: KafkaHighConsumerLag
    expr: |
      sum(kafka_consumergroup_lag{topic!="__consumer_offsets"}) > 1000000
      and
      rate(kafka_consumergroup_current_offset{topic!="__consumer_offsets"}[10m]) <= 0
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: "High Kafka Consumer Lag"
      description: "Consumers are falling behind and offsets are not advancing. Total lag: {{ $value }} messages."

- name: Kafka-ConsumerStalled
  rules:
  - alert: KafkaStalledConsumerGroup
    expr: |
      sum(kafka_consumergroup_lag{topic!="__consumer_offsets"}) > 50
      and rate(kafka_consumergroup_current_offset[5m]) <= 0
    for: 10m
    labels:
      severity: critical
    annotations:
      summary: "Kafka Consumer Group Stalled"
      description: "Offsets not increasing for 10 minutes while lag is high."

- name: MariaDB-Health
  rules:

  - alert: MariaDBDown
    expr: mysql_up{job=~"mariadb-.*-exporter"} == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "MariaDB Down ({{ $labels.instance }})"
      description: "MariaDB instance or exporter is unreachable."

  - alert: MariaDBReplicationSLAUnhealthy
    expr: |
      (mysql_up{job=~"mariadb-.*-exporter"} == 0)
      OR (mysql_slave_status_slave_io_running{job="mariadb-slave-exporter"} == 0)
      OR (mysql_slave_status_slave_sql_running{job="mariadb-slave-exporter"} == 0)
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: "MariaDB Replication SLA Unhealthy"
      description: |
        Replication issue detected:
        - Exporter down
        - IO Thread stopped
        - SQL Thread stopped

  - alert: MariaDBSlaveDisconnected
    expr: mysql_global_status_slaves_connected{job="mariadb-master-exporter"} == 0
    for: 3m
    labels:
      severity: critical
    annotations:
      summary: "MariaDB Slave Disconnected ({{ $labels.instance }})"
      description: "Slave is no longer connected to the Master."

  - alert: MariaDBReplicationLagHigh
    expr: mysql_slave_status_seconds_behind_master{job="mariadb-slave-exporter"} > 60
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: "MariaDB Replication Lag High ({{ $labels.instance }})"
      description: |
        Slave is {{ $value }} seconds behind master.

  - alert: MariaDBReplicationError
    expr: mysql_slave_status_last_errno{job="mariadb-slave-exporter"} > 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "MariaDB Replication SQL Error ({{ $labels.instance }})"
      description: |
        SQL thread encountered an error. Code: {{ $value }}

  - alert: MariaDBReplicationRecovered
    expr: |
      mysql_global_status_slaves_connected > 0
      and mysql_slave_status_slave_io_running == 1
      and mysql_slave_status_slave_sql_running == 1
    for: 3m
    labels:
      severity: info
    annotations:
      summary: "MariaDB Replication Recovered"
      description: "Replication is healthy again on {{ $labels.instance }}"

  - alert: MariaDBMasterReadOnlyEnabled
    expr: mysql_global_variables_read_only{job="mariadb-master-exporter"} == 1
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "MariaDB Master in Read-Only Mode ({{ $labels.instance }})"
      description: |
        Master entered read-only mode — Writes will fail.

- name: Kafka-JVMHighHeap
  rules:
  - alert: KafkaHighJVMHeapUsage
    expr: (jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"}) * 100 > 80
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Kafka JVM Heap Usage High"
      description: "Heap usage is above 80% for {{ $labels.instance }}. Current usage: {{ $value }}%"

- name: Kafka-JVMHeapCritical
  rules:
  - alert: KafkaJVMHeapCritical
    expr: (jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"}) * 100 > 90
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: "Kafka JVM Heap Critical"
      description: "Heap nearing full on {{ $labels.instance }}. May cause OOM or GC pauses."

- name: Kafka-ThreadLeak
  rules:
  - alert: KafkaHighThreadCount
    expr: jvm_threads_count > 300
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Kafka Thread Count High"
      description: "Thread count increased abnormally on {{ $labels.instance }}. May indicate thread leak."

- name: Kafka-HighMemoryUsage
  rules:
  - alert: KafkaHighMemoryUsage
    expr: process_resident_memory_bytes / 8e+9 * 100 > 90
    for: 10m
    labels:
      severity: critical
    annotations:
      summary: "Kafka Memory Usage Critical"
      description: "Kafka broker memory usage >90% on {{ $labels.instance }}."

- name: Kafka-HighCPU
  rules:
  - alert: KafkaHighCPUUsage
    expr: rate(process_cpu_seconds_total{job="kafka_jmx"}[5m]) / 8 * 100 > 80
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: "Kafka CPU Usage High"
      description: "CPU usage above 80% for {{ $labels.instance }}."

- name: Kafka-GCHigh
  rules:
  - alert: KafkaHighGCPause
    expr: rate(jvm_gc_collection_seconds_sum[5m]) > 0.2
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Kafka GC Pause Time High"
      description: "GC pause time >200ms/sec on {{ $labels.instance }} — may cause latency spikes."

- name: Kafka-NoController
  rules:
  - alert: KafkaNoActiveController
    expr: sum(kafka_controller_activecontrollercount) != 1
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "Kafka Active Controller Missing"
      description: "No Active Controller detected — cluster will not elect leaders!"

# -----------------------------
# NEW: Kubernetes Pod Health
# -----------------------------

- name: kubernetes-pod-health
  rules:

    - alert: PodEvicted
      expr: kube_pod_status_reason{reason="Evicted"} == 1
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Pod evicted ({{ $labels.namespace }}/{{ $labels.pod }})"
        description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has been evicted."

    - alert: PodCrashLooping
      expr: rate(kube_pod_container_status_restarts_total[15m]) * 900 > 3
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Pod crash looping ({{ $labels.namespace }}/{{ $labels.pod }})"
        description: "Pod {{ $labels.pod }} is restarting frequently. Restarts: {{ $value }}"

    - alert: PodNotRunning
      expr: kube_pod_status_phase{phase!~"Running|Succeeded"} == 1
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "Pod not running ({{ $labels.namespace }}/{{ $labels.pod }})"
        description: "Pod {{ $labels.pod }} is in {{ $labels.phase }} state for over 10 minutes."

    - alert: ContainerOOMKilled
      expr: kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Container OOM killed ({{ $labels.namespace }}/{{ $labels.pod }})"
        description: "Container {{ $labels.container }} in pod {{ $labels.pod }} was OOM killed."

# -----------------------------
# NEW: Kubernetes Node Health
# -----------------------------

- name: kubernetes-node-health
  rules:

    - alert: NodeDiskPressure
      expr: kube_node_status_condition{condition="DiskPressure",status="true"} == 1
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Node disk pressure ({{ $labels.node }})"
        description: "Node {{ $labels.node }} has DiskPressure — pods will be evicted."

    - alert: NodeMemoryPressure
      expr: kube_node_status_condition{condition="MemoryPressure",status="true"} == 1
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Node memory pressure ({{ $labels.node }})"
        description: "Node {{ $labels.node }} has MemoryPressure — pods may be evicted."

    - alert: NodeNotReady
      expr: kube_node_status_condition{condition="Ready",status="true"} == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Node not ready ({{ $labels.node }})"
        description: "Node {{ $labels.node }} has been NotReady for over 2 minutes."

# -----------------------------
# NEW: PVC Critical Threshold
# -----------------------------

- name: PVC-usage-critical
  rules:

    - alert: PVCCriticalUsage
      expr: (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) * 100 > 90
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "PVC critically full ({{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }})"
        description: "PVC {{ $labels.persistentvolumeclaim }} usage is {{ $value | printf \"%.1f\" }}% — risk of pod eviction."


- name: High-Pod-CPU
  rules:
  - alert: HighPodCPU
    expr: avg(rate(container_cpu_usage_seconds_total{namespace!="",image!="",container_name!="POD"}[5m])*100) by (pod,namespace  )  > 3600
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: HighCpuUsage
      description: "Pod cpu average value : {{ $value | printf \"%.2f\" }}"

- name: High-Pod-Memory
  rules:
  - alert: PodMemoryHigh
    expr: sum(container_memory_usage_bytes{image!=""})
          by (namespace, pod)
          > 85899345920
    for: 3m
    labels:
      severity: critical
    annotations:
      summary: HighPodMemoryUsage
      description: "Pod memory usage exceeds 80GB for pod {{$labels.pod}} in {{$labels.namespace}} namespace"

- name: PVC-usage
  rules:
    - alert: PVCHighUsage
      expr: (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) * 100 > 85
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: PVC high usage (namespace {{ $labels.namespace }}, claim {{ $labels.persistentvolumeclaim }})
        description: |-
          Description: PVC usage > 85%
          VALUE = {{ $value }}%
      
- name: ClickHouse-Disk
  rules:
  - alert: ClickHouseDiskSpaceLow
    expr: (ClickHouseAsyncMetrics_FilesystemMainPathAvailableBytes / ClickHouseAsyncMetrics_FilesystemMainPathTotalBytes) < 0.15
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: "ClickHouse disk space critically low (instance {{ $labels.instance }})"
      description: "Free disk space < 15%\nVALUE = {{ $value }}\nLABELS = {{ $labels }}"

- name: ClickHouse-Memory
  rules:
  - alert: ClickHouseMemoryHigh
    expr: (ClickHouseAsyncMetrics_MemoryResident / ClickHouseAsyncMetrics_OSMemoryTotal) > 0.85
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: "ClickHouse memory usage high (instance {{ $labels.instance }})"
      description: "Memory usage > 85%\nVALUE = {{ $value }}\nLABELS = {{ $labels }}"

- name: ClickHouse-Connections
  rules:
  - alert: ClickHouseRejectingConnections
    expr: (ClickHouseAsyncMetrics_HTTPRejectedConnections + ClickHouseAsyncMetrics_TCPRejectedConnections) > 0
    for: 30s
    labels:
      severity: critical
    annotations:
      summary: "ClickHouse is rejecting client connections (instance {{ $labels.instance }})"
      description: "Rejected connections detected (> 0)\nVALUE = {{ $value }}"

- name: ClickHouse-Queries
  rules:
  - alert: ClickHouseTooManyConcurrentQueries
    expr: ClickHouseMetrics_Query > 200
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: "Too many concurrent queries (instance {{ $labels.instance }})"
      description: "Concurrent queries > 150\nVALUE = {{ $value }}"

  - alert: ClickHouseQueryQueueOverload
    expr: ClickHouseMetrics_QueryPending > 20
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "ClickHouse query queue overload (instance {{ $labels.instance }})"
      description: "Pending queries > 20 (queries waiting in queue)\nVALUE = {{ $value }}"

- name: ClickHouse-ZooKeeper
  rules:
  - alert: ClickHouseZooKeeperSessionLost
    expr: ClickHouseMetrics_ZooKeeperSession != 1
    for: 30s
    labels:
      severity: critical
    annotations:
      summary: "ClickHouse ZooKeeper session lost"
      description: "ZooKeeper session state != 1\nVALUE = {{ $value }}"          
      

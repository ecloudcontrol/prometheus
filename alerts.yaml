groups:

- name: Cpu-usage
  rules:
  - alert: HostHighCpuLoad
    expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle", instance!="192.168.150.194:9100"}[2m])) * 100) > 95
    for: 3m
    labels:
      severity: warning
    annotations:
      summary: Host high CPU load (instance {{ $labels.instance }})
      description: "CPU load is > 95%\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

- name: Disk-usage
  rules:
  - alert: 'Low data disk space'
    expr: ceil(((node_filesystem_size_bytes{mountpoint!="/boot"} - node_filesystem_free_bytes{mountpoint!="/boot"}) / node_filesystem_size_bytes{mountpoint!="/boot"} * 100)) > 95
    labels:
      severity: 'critical'
    annotations:
      title: "Disk Usage"
      description: 'Partition : {{$labels.mountpoint}}'
      summary: "Disk usage is `{{humanize $value}}%`"
      host: "{{$labels.instance}}"

- name: Memory-usage
  rules:
  - alert: HostOutOfMemory
    expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes * 100 < 8
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: Host out of memory (instance {{ $labels.instance }})
      description: "Node memory is filling up (< 8% left)\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

- name: Disk-usage-check
  rules:
  - alert: Host Out Of DiskSpace
    expr: (node_filesystem_avail_bytes * 100) / node_filesystem_size_bytes < 10 and ON (instance, device, mountpoint) node_filesystem_readonly == 0
    for: 5m
    labels:
      severity: warning
    annotations:
      title: "Low Disk space"
      summary: Host out of disk space (instance {{ $labels.instance }})
      description: "Disk is getting full (< 10% left)\n  Available Space is only= {{ $value }} %\n  LABELS = {{ $labels }}"

- name: CPU-load
  rules:
  - alert: HighNodeCPU
    expr: node_load15 / count by (instance, job) (node_cpu_seconds_total{mode="idle"}) >=2
    for : 5m
    labels:
      severity: warning
    annotations:
      summary: "High CPU load (instance {{ $labels.instance }})"
      description: "CPU load is high\n  VALUE = {{ $value }}\n  LABELS: {{ $labels }}"

- name: ClickHouse-Disk
  rules:
  - alert: ClickHouseDiskSpaceLow
    expr: (ClickHouseAsyncMetrics_FilesystemMainPathAvailableBytes / ClickHouseAsyncMetrics_FilesystemMainPathTotalBytes) < 0.15
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: "ClickHouse disk space critically low (instance {{ $labels.instance }})"
      description: "Free disk space < 15%\nVALUE = {{ $value }}\nLABELS = {{ $labels }}"

- name: ClickHouse-Memory
  rules:
  - alert: ClickHouseMemoryHigh
    expr: (ClickHouseAsyncMetrics_MemoryResident / ClickHouseAsyncMetrics_OSMemoryTotal) > 0.85
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: "ClickHouse memory usage high (instance {{ $labels.instance }})"
      description: "Memory usage > 85%\nVALUE = {{ $value }}\nLABELS = {{ $labels }}"

- name: ClickHouse-Connections
  rules:
  - alert: ClickHouseRejectingConnections
    expr: (ClickHouseAsyncMetrics_HTTPRejectedConnections + ClickHouseAsyncMetrics_TCPRejectedConnections) > 0
    for: 30s
    labels:
      severity: critical
    annotations:
      summary: "ClickHouse is rejecting client connections (instance {{ $labels.instance }})"
      description: "Rejected connections detected (> 0)\nVALUE = {{ $value }}"

- name: ClickHouse-Queries
  rules:
  - alert: ClickHouseTooManyConcurrentQueries
    expr: ClickHouseMetrics_Query > 50
    for: 1m
    labels:
      severity: warning
    annotations:
      summary: "Too many concurrent queries (instance {{ $labels.instance }})"
      description: "Concurrent queries > 50\nVALUE = {{ $value }}"

  - alert: ClickHouseQueryQueueOverload
    expr: ClickHouseMetrics_QueryPending > 20
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "ClickHouse query queue overload (instance {{ $labels.instance }})"
      description: "Pending queries > 20 (queries waiting in queue)\nVALUE = {{ $value }}"

- name: ClickHouse-ZooKeeper
  rules:
  - alert: ClickHouseZooKeeperSessionLost
    expr: ClickHouseMetrics_ZooKeeperSession != 1
    for: 30s
    labels:
      severity: critical
    annotations:
      summary: "ClickHouse ZooKeeper session lost"
      description: "ZooKeeper session state != 1\nVALUE = {{ $value }}"

- name: PVC-usage
  rules:
    - alert: PVCHighUsage
      expr: (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) * 100 > 85
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: PVC high usage (namespace {{ $labels.namespace }}, claim {{ $labels.persistentvolumeclaim }})
        description: |-
          Description: PVC usage > 85%
          VALUE = {{ $value }}%

- name: ClickHouse-Replication
  rules:
  - alert: ClickHouseReadonlyReplica
    expr: ClickHouseMetrics_ReadonlyReplica != 0
    for: 30s
    labels:
      severity: critical
    annotations:
      summary: "ClickHouse has read-only replicas (instance {{ $labels.instance }})"
      description: "ReadonlyReplica metric != 0 - one or more replicated tables are stuck read-only, likely a Keeper registration/coordination issue\nVALUE = {{ $value }}"

- name: ClickHouse-Query-Errors
  rules:
  - alert: ClickHouseUnknownTableSpike
    expr: increase(ClickHouseErrorMetric_UNKNOWN_TABLE[5m]) > 3
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "Spike in UNKNOWN_TABLE errors (instance {{ $labels.instance }})"
      description: "Multiple UNKNOWN_TABLE errors in 5m - almost always a missing MV/table on one or more replicas, causing live user-facing 500s\nVALUE = {{ $value }}"

- name: Pod-Lifecycle
  rules:
  - alert: PodRestarted
    expr: increase(kube_pod_container_status_restarts_total{namespace="vv-prod"}[10m]) > 0
    labels:
      severity: warning
    annotations:
      summary: "Pod {{ $labels.pod }} restarted"
      description: "Container {{ $labels.container }} in pod {{ $labels.pod }} restarted in the last 10m\nVALUE = {{ $value }}"
  - alert: PodOOMKilled
    expr: kube_pod_container_status_last_terminated_reason{namespace="vv-prod", reason="OOMKilled"} == 1
    labels:
      severity: critical
    annotations:
      summary: "Pod {{ $labels.pod }} was OOM-killed"
      description: "Container {{ $labels.container }} in pod {{ $labels.pod }} exceeded its memory limit and was hard-killed by the kernel"

- name: Airflow-Health
  rules:
  - alert: AirflowSchedulerDown
    expr: kube_deployment_status_replicas_available{namespace="airflow", deployment=~".*scheduler.*"} == 0
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: "Airflow scheduler has no available replicas"
      description: "Scheduler deployment in the airflow namespace has 0 available replicas - DAG runs will stall and no new tasks get scheduled\nVALUE = {{ $value }}"
  - alert: AirflowDagRunFailed
    expr: increase(airflow_dag_run_failed[15m]) > 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "Airflow DAG run failed (dag {{ $labels.dag_id }})"
      description: "One or more DAG runs failed in the last 15m\nVALUE = {{ $value }}"
  - alert: AirflowDagRunStuckRunning
    expr: (time() - airflow_dag_run_start_timestamp) > 21600 and on(dag_id) airflow_dag_run_state == 1
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Airflow DAG run stuck in Running (dag {{ $labels.dag_id }})"
      description: "DAG run has stayed in Running state for over 6h - can mask a hung/false-success run\nVALUE = {{ $value }}"

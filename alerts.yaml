- name: High-Pod-CPU
  rules:
  - alert: HighPodCPU
    expr: avg(rate(container_cpu_usage_seconds_total{namespace!="",image!="",container_name!="POD"}[5m])*100) by (pod,namespace  )  > 3600
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: HighCpuUsage
      description: "Pod cpu average value : {{ $value | printf \"%.2f\" }}"

- name: High-Pod-Memory
  rules:
  - alert: PodMemoryHigh
    expr: sum(container_memory_usage_bytes{image!=""})
          by (namespace, pod)
          > 85899345920
    for: 3m
    labels:
      severity: critical
    annotations:
      summary: HighPodMemoryUsage
      description: "Pod memory usage exceeds 80GB for pod {{$labels.pod}} in {{$labels.namespace}} namespace"

- name: PVC-usage
  rules:
    - alert: PVCHighUsage
      expr: (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) * 100 > 85
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: PVC high usage (namespace {{ $labels.namespace }}, claim {{ $labels.persistentvolumeclaim }})
        description: |-
          Description: PVC usage > 85%
          VALUE = {{ $value }}%

- name: ClickHouse-Disk
  rules:
  - alert: ClickHouseDiskSpaceLow
    expr: (ClickHouseAsyncMetrics_FilesystemMainPathAvailableBytes / ClickHouseAsyncMetrics_FilesystemMainPathTotalBytes) < 0.15
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: "ClickHouse disk space critically low (instance {{ $labels.instance }})"
      description: "Free disk space < 15%\nVALUE = {{ $value }}\nLABELS = {{ $labels }}"

- name: ClickHouse-Memory
  rules:
  - alert: ClickHouseMemoryHigh
    expr: (ClickHouseAsyncMetrics_MemoryResident / ClickHouseAsyncMetrics_OSMemoryTotal) > 0.85
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: "ClickHouse memory usage high (instance {{ $labels.instance }})"
      description: "Memory usage > 85%\nVALUE = {{ $value }}\nLABELS = {{ $labels }}"

- name: ClickHouse-Connections
  rules:
  - alert: ClickHouseRejectingConnections
    expr: (ClickHouseAsyncMetrics_HTTPRejectedConnections + ClickHouseAsyncMetrics_TCPRejectedConnections) > 0
    for: 30s
    labels:
      severity: critical
    annotations:
      summary: "ClickHouse is rejecting client connections (instance {{ $labels.instance }})"
      description: "Rejected connections detected (> 0)\nVALUE = {{ $value }}"

- name: ClickHouse-Queries
  rules:
  - alert: ClickHouseApproachingConcurrentQueryLimit
    expr: ClickHouseMetrics_Query / ClickHouseMetrics_MaxConcurrentQueries > 0.85
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "ClickHouse approaching max_concurrent_queries limit (instance {{ $labels.instance }})"
      description: "Concurrent queries at {{ $value | humanizePercentage }} of configured max_concurrent_queries - check is_initial_query split in system.processes; historically this means the node is slow and other replicas' sub-queries are piling up, not organic direct load\nVALUE = {{ $value }}"
  - alert: ClickHouseConcurrentQueryLimitHit
    expr: increase(ClickHouseErrorMetric_TOO_MANY_SIMULTANEOUS_QUERIES[5m]) > 0
    for: 30s
    labels:
      severity: critical
    annotations:
      summary: "ClickHouse hit max_concurrent_queries and is rejecting queries (instance {{ $labels.instance }})"
      description: "TOO_MANY_SIMULTANEOUS_QUERIES errors detected - node is fully saturated and rejecting new connections, including diagnostic queries. Recurred 3x on 2026-09-02 (pod-6, pod-2, pod-1), always on a recently-restarted pod with high absolute_delay/queue_size in system.replicas\nVALUE = {{ $value }}"
  - alert: ClickHouseQueryQueueOverload
    expr: ClickHouseMetrics_QueryPending > 20
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "ClickHouse query queue overload (instance {{ $labels.instance }})"
      description: "Pending queries > 20 (queries waiting in queue)\nVALUE = {{ $value }}"
  - alert: ClickHouseSocketTimeoutSpike
    expr: increase(ClickHouseErrorMetric_SOCKET_TIMEOUT[5m]) > 3
    for: 1m
    labels:
      severity: warning
    annotations:
      summary: "Multiple client socket timeouts (instance {{ $labels.instance }})"
      description: "More than 3 SOCKET_TIMEOUT errors in 5m - clients are disconnecting before large/slow queries finish; check for expensive IN-list joins or raise client timeouts\nVALUE = {{ $value }}"

- name: ClickHouse-ZooKeeper
  rules:
  - alert: ClickHouseZooKeeperSessionLost
    expr: ClickHouseMetrics_ZooKeeperSession != 1
    for: 30s
    labels:
      severity: critical
    annotations:
      summary: "ClickHouse ZooKeeper session lost"
      description: "ZooKeeper session state != 1\nVALUE = {{ $value }}"

- name: ClickHouse-Replication
  rules:
  - alert: ClickHouseReadonlyReplica
    expr: ClickHouseMetrics_ReadonlyReplica != 0
    for: 30s
    labels:
      severity: critical
    annotations:
      summary: "ClickHouse has read-only replicas (instance {{ $labels.instance }})"
      description: "ReadonlyReplica metric != 0 - one or more replicated tables are stuck read-only, likely a Keeper registration/coordination issue\nVALUE = {{ $value }}"
  - alert: ClickHouseReplicationQueueBacklog
    expr: ClickHouseMetrics_ReplicasMaxQueueSize > 100
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "ClickHouse replication queue backlog (instance {{ $labels.instance }})"
      description: "Max replication queue size > 100 - a replica may be falling behind or stuck\nVALUE = {{ $value }}"
  - alert: ClickHouseReplicaCountMismatch
    expr: max by (database, table) (ClickHouseCustom_TableReplicaCount) != 7
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: "Table replica count mismatch detected (instance {{ $labels.instance }})"
      description: "A replicated table/MV does not have all 7 expected replicas - table is missing on one or more nodes. Requires a custom textfile-exporter script, see notes below.\nVALUE = {{ $value }}"

- name: ClickHouse-DDL
  rules:
  - alert: ClickHouseDistributedDDLTimeout
    expr: increase(ClickHouseErrorMetric_TIMEOUT_EXCEEDED[15m]) > 0
    for: 30s
    labels:
      severity: critical
    annotations:
      summary: "ClickHouse distributed DDL query timed out (instance {{ $labels.instance }})"
      description: "A distributed_ddl_queue query raised TIMEOUT_EXCEEDED - this exact signature leaves orphaned replicas/tables on partial nodes (root cause of the Aug 15-17 incidents)\nVALUE = {{ $value }}"
  - alert: ClickHouseReplicaAlreadyExists
    expr: increase(ClickHouseErrorMetric_REPLICA_ALREADY_EXISTS[15m]) > 0
    for: 30s
    labels:
      severity: critical
    annotations:
      summary: "ClickHouse replica registration conflict detected (instance {{ $labels.instance }})"
      description: "REPLICA_ALREADY_EXISTS - a table/MV creation collided with a stale ZooKeeper replica path, almost always means an orphaned .inner_id table is blocking recreation\nVALUE = {{ $value }}"
  - alert: ClickHouseTableWasNotDropped
    expr: increase(ClickHouseErrorMetric_TABLE_WAS_NOT_DROPPED[15m]) > 0
    for: 30s
    labels:
      severity: warning
    annotations:
      summary: "ClickHouse table drop blocked by local table conflict (instance {{ $labels.instance }})"
      description: "TABLE_WAS_NOT_DROPPED - usually an .inner_id orphan table occupying a ZooKeeper path; needs manual cleanup before recreation succeeds\nVALUE = {{ $value }}"
  - alert: ClickHouseOptimizeFinalRunning
    expr: increase(ClickHouseProfileEvents_OptimizeSkipMergedPartitions[1h]) > 0
    for: 1m
    labels:
      severity: info
    annotations:
      summary: "OPTIMIZE ... FINAL executed (instance {{ $labels.instance }})"
      description: "Tracks full-table OPTIMIZE FINAL operations - expensive, cluster-wide, and the known trigger behind the nightly Airflow DDL timeouts\nVALUE = {{ $value }}"

- name: ClickHouse-Query-Errors
  rules:
  - alert: ClickHouseUnknownTableSpike
    expr: increase(ClickHouseErrorMetric_UNKNOWN_TABLE[5m]) > 3
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "Spike in UNKNOWN_TABLE errors (instance {{ $labels.instance }})"
      description: "Multiple UNKNOWN_TABLE errors in 5m - almost always a missing MV/table on one or more replicas, causing live user-facing 500s (this is exactly how the video_detected_placements_mv gap was first detected)\nVALUE = {{ $value }}"

- name: ClickHouse-Kafka
  rules:
  - alert: ClickHouseKafkaAssignmentFailure
    expr: increase(ClickHouseAsyncMetrics_KafkaConsumers[15m]) < 1
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "ClickHouse Kafka consumer assignment issue (instance {{ $labels.instance }})"
      description: "Kafka engine table can't get partition assignment - check consumer group health and broker connectivity\nVALUE = {{ $value }}"

- name: ClickHouse-Pod-Lifecycle
  rules:
  - alert: ClickHouseReplicaRestarted
    expr: increase(kube_pod_container_status_restarts_total{namespace="viralvue-prod", pod=~"clickhousecluster-25-6-.*"}[10m]) > 0
    labels:
      severity: warning
    annotations:
      summary: "ClickHouse pod {{ $labels.pod }} restarted"
      description: "Pod restarted - based on 2026-09-02 incidents, expect this node to accumulate replication lag and potentially hit max_concurrent_queries within 15-90 minutes as it catches up through the background_fetches_pool_size bottleneck; monitor system.replicas queue_size and absolute_delay on this specific pod"
  - alert: ClickHouseReplicaOOMKilled
    expr: kube_pod_container_status_last_terminated_reason{namespace="viralvue-prod", pod=~"clickhousecluster-25-6-.*", reason="OOMKilled"} == 1
    labels:
      severity: critical
    annotations:
      summary: "ClickHouse pod {{ $labels.pod }} was OOM-killed"
      description: "Pod exceeded its memory limit and was hard-killed by the kernel. This was the trigger for the 2026-09-01 22:38 cascading outage - expect Connection reset by peer errors and a replication retry storm on peer nodes within minutes if not addressed"

groups:

# ============================
# 🧠 CPU Usage Alerts
# ============================
- name: Cpu-usage
  rules:
  - alert: HostHighCpuLoad
    expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) > 90
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Host high CPU load (instance {{ $labels.instance }})
      description: "CPU load is > 90%\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

# ============================
# 💾 Linux Disk Usage Alerts
# ============================
- name: Disk-usage
  rules:
  - alert: LowDataDiskSpace
    expr: ceil(((node_filesystem_size_bytes{mountpoint!="/boot"} - node_filesystem_free_bytes{mountpoint!="/boot"}) / node_filesystem_size_bytes{mountpoint!="/boot"} * 100)) > 95
    for: 10m
    labels:
      severity: critical
    annotations:
      title: "Disk Usage"
      description: 'Partition: {{$labels.mountpoint}}'
      summary: "Disk usage is `{{humanize $value}}%`"
      host: "{{$labels.instance}}"

# ============================
# 🧠 Memory Usage
# ============================
- name: Memory-usage
  rules:
  - alert: HostOutOfMemory
    expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes * 100 < 8
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: Host out of memory (instance {{ $labels.instance }})
      description: "Node memory is filling up (< 8% left)\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

# ============================
# 💽 Disk Space (Linux)
# ============================
- name: Disk-usage-check
  rules:
  - alert: HostOutOfDiskSpace
    expr: (node_filesystem_avail_bytes * 100) / node_filesystem_size_bytes < 10 and ON (instance, device, mountpoint) node_filesystem_readonly == 0
    for: 10m
    labels:
      severity: warning
    annotations:
      title: "Low Disk space"
      summary: Host out of disk space (instance {{ $labels.instance }})
      description: "Disk is getting full (< 10% left)\n  Available Space = {{ $value }} %\n  LABELS = {{ $labels }}"

# ============================
# 🖥️ CPU Load
# ============================
- name: CPU-load
  rules:
  - alert: HighNodeCPU
    expr: node_load15 / count by (instance, job) (node_cpu_seconds_total{mode="idle"}) >= 2
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: "High CPU load (instance {{ $labels.instance }})"
      description: "CPU load is high\n  VALUE = {{ $value }}\n  LABELS: {{ $labels }}"

# ============================
# 🪟 Windows Alerts
# ============================
- name: Windows-CPU-Usage
  rules:
  - alert: WindowsHighCpuUsage
    expr: 100 - (sum by (instance) (rate(windows_cpu_time_total{mode="idle"}[2m])) / count by (instance) (windows_cpu_time_total{mode="idle"}) * 100) > 95
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: High CPU usage on Windows Server (instance {{ $labels.instance }})
      description: "CPU usage > 95% for over 5 minutes.\n  VALUE = {{ $value | printf \"%.2f\" }}%\n  LABELS = {{ $labels }}"
      host: "{{ $labels.instance }}"
      title: "High CPU Usage"

- name: Windows-Memory-Usage
  rules:
  - alert: WindowsLowMemory
    expr: (windows_os_physical_memory_free_bytes / windows_os_visible_memory_bytes * 100) < 10
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: Low memory on Windows Server (instance {{ $labels.instance }})
      description: "Available memory is < 10%.\n  VALUE = {{ $value | printf \"%.2f\" }}%\n  LABELS = {{ $labels }}"
      host: "{{ $labels.instance }}"
      title: "Low Memory"

# ============================
# 💽 Windows Disk Alerts
# ============================
- name: Windows-Disk-Usage
  rules:
  - alert: WindowsLowDiskSpace
    expr: (windows_logical_disk_free_bytes / windows_logical_disk_size_bytes * 100) < 10
    for: 10m
    labels:
      severity: critical
    annotations:
      summary: Low disk space on Windows Server (instance {{ $labels.instance }})
      description: "Disk space < 10% on volume {{ $labels.volume }}.\n  Available = {{ $value | printf \"%.2f\" }}%\n  LABELS = {{ $labels }}"
      host: "{{ $labels.instance }}"
      title: "Low Disk Space"

  - alert: WindowsHighDiskLatency
    expr: rate(windows_logical_disk_read_write_latency_seconds_total[10m]) > 1   # 1s threshold
    for: 1h
    labels:
      severity: warning
    annotations:
      summary: High disk latency on Windows Server (instance {{ $labels.instance }})
      description: "Average disk latency > 500ms for 15 minutes on volume {{ $labels.volume }}.\n  VALUE = {{ $value | printf \"%.3f\" }}s\n  LABELS = {{ $labels }}"
      host: "{{ $labels.instance }}"
      title: "High Disk Latency"

# ============================
# 🌐 Windows Network Alerts
# ============================
- name: Windows-Network-Usage
  rules:
  - alert: WindowsHighNetworkUsage
    expr: rate(windows_net_bytes_total{nic="Amazon_Elastic_Network_Adapter"}[10m]) > 10000000
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: High network usage on Windows Server (instance {{ $labels.instance }})
      description: "Network > 10MB/s on {{ $labels.nic }}.\n  VALUE = {{ $value | printf \"%.2f\" }} bytes/s\n  LABELS = {{ $labels }}"
      host: "{{ $labels.instance }}"
      title: "High Network Usage"

  - alert: WindowsNetworkErrors
    expr: rate(windows_net_packets_received_errors_total{nic="Amazon_Elastic_Network_Adapter"}[10m]) > 0 or rate(windows_net_packets_outbound_errors_total{nic="Amazon_Elastic_Network_Adapter"}[10m]) > 0
    for: 10m
    labels:
      severity: critical
    annotations:
      summary: Network errors on Windows Server (instance {{ $labels.instance }})
      description: "Network errors detected on {{ $labels.nic }}.\n  LABELS = {{ $labels }}"
      host: "{{ $labels.instance }}"
      title: "Network Errors"

# ============================
# 🕓 Windows Server Availability
# ============================
- name: windows_server_alerts
  rules:
  - alert: WindowsServerDown
    expr: probe_success{job="windows_servers_up"} == 0
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: "Windows server {{ $labels.instance }} is down"
      description: "ICMP probe failed for {{ $labels.instance }}. Check network or server status."

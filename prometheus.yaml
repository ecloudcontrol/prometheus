global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    datacenter: primary

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alert-manager-0-27.alpha-prod.svc.cluster.local:9093

rule_files:
  - /opt/bitnami/prometheus/conf/rules.yaml
  - /opt/bitnami/prometheus/conf/alerts.yaml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets:
          - '172.233.218.178:9100'
          - '192.168.162.16:9100'
          - '192.168.162.96:9100'
          - '192.168.147.84:9100'
          - '192.168.153.199:9100'
          - '192.168.144.93:9100'
          - '192.168.151.43:9100'
          - '192.168.136.15:9100'
          - '192.168.180.79:9100'
          - '192.168.153.40:9100'
          - '192.168.162.4:9100'
          - '192.168.137.31:9100'
          - '192.168.147.226:9100'
          - '192.168.162.5:9100'
          - '192.168.137.13:9100'
          - '192.168.153.194:9100'
          - '192.168.160.243:9100'
          - '192.168.159.133:9100'
          - '192.168.147.168:9100'
          - '192.168.160.143:9100'
          - '192.168.159.113:9100'
          - '192.168.128.207:9100'
          - '192.168.147.155:9100'
          - '192.168.153.91:9100'
          - '192.168.153.209:9100'
          - '192.168.153.172:9100'
          - '192.168.151.89:9100'
          - '192.168.144.13:9100'
          - '192.168.150.61:9100'
          - '192.168.128.29:9100'
          - '192.168.162.230:9100'
          - '192.168.147.149:9100'
          - '192.168.153.245:9100'
          - '192.168.128.15:9100'
          - '192.168.195.16:9100'
          - '192.168.137.106:9100'
    metric_relabel_configs:
      - source_labels: ['nodename']
        regex: '(vv.master)'
        target_label: nodename
        replacement: vv-${1}
      - source_labels: ['nodename']
        regex: 'vv.worker.node.(.*)'
        target_label: nodename
        replacement: vv-${1}

  - job_name: 'kube-state-metrics'
    static_configs:
      - targets: ['kube-state-metrics.kube-system.svc.cluster.local:8080']

  - job_name: 'clickhouse'
    static_configs:
      - targets:
          - 'clickhousecluster-25-6-0.clickhousecluster-25-6.viralvue-prod.svc.cluster.local:9363'
          - 'clickhousecluster-25-6-1.clickhousecluster-25-6.viralvue-prod.svc.cluster.local:9363'
          - 'clickhousecluster-25-6-2.clickhousecluster-25-6.viralvue-prod.svc.cluster.local:9363'
          - 'clickhousecluster-25-6-3.clickhousecluster-25-6.viralvue-prod.svc.cluster.local:9363'
          - 'clickhousecluster-25-6-4.clickhousecluster-25-6.viralvue-prod.svc.cluster.local:9363'

  - job_name: 'kubernetes-cadvisor'
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels:
          - __meta_kubernetes_node_name
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
        
  - job_name: 'kubernetes-kubelet'
    scheme: https
    metrics_path: /metrics
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics
        
  - job_name: 'kubernetes-nodes'
    kubernetes_sd_configs:
      - role: node
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)


      action: keep
    - source_labels: [__meta_kubernetes_pod_container_port_number]
      regex: "9104"
      action: keep
    - source_labels: [__meta_kubernetes_pod_ip]
      target_label: __address__
      replacement: ${1}:9104
      action: replace
    - target_label: slave_id
      replacement: mysql-replicas-0
    - target_label: instance
      replacement: mysql-replicas-0
    - target_label: role
      replacement: slave-replicas
    - target_label: db_engine
      replacement: mysql-replicas

  - job_name: 'mysql-slave-replica-exporter-1'
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
    - source_labels: [__meta_kubernetes_pod_name]
      regex: mysql-replicas-8-0-1
      action: keep
    - source_labels: [__meta_kubernetes_pod_container_port_number]
      regex: "9104"
      action: keep
    - source_labels: [__meta_kubernetes_pod_ip]
      target_label: __address__
      replacement: ${1}:9104
      action: replace
    - target_label: slave_id
      replacement: mysql-replicas-1
    - target_label: instance
      replacement: mysql-replicas-1
    - target_label: role
      replacement: slave-replicas
    - target_label: db_engine
      replacement: mysql-replicas

  - job_name: 'mysql-slave-replica-exporter-2'
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
    - source_labels: [__meta_kubernetes_pod_name]
      regex: mysql-replicas-8-0-2
      action: keep
    - source_labels: [__meta_kubernetes_pod_container_port_number]
      regex: "9104"
      action: keep
    - source_labels: [__meta_kubernetes_pod_ip]
      target_label: __address__
      replacement: ${1}:9104
      action: replace
    - target_label: slave_id
      replacement: mysql-replicas-2
    - target_label: instance
      replacement: mysql-replicas-2
    - target_label: role
      replacement: slave-replicas
    - target_label: db_engine
      replacement: mysql-replicas

  - job_name: 'app_db_health'
    scrape_interval: 15s
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['mysql-healthcheck-3-11:5000/health/db']

    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter-0-2:9115

  - job_name: 'windows_rdp_tcp_check'
    scrape_interval: 15s
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - '172.239.142.27:3389'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
        replacement: windows-server
      - target_label: __address__
        replacement: blackbox-exporter-0-2:9115

  - job_name: 'windows_exporter_http_check'
    scrape_interval: 15s
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - 'http://172.239.142.27:9182/metrics'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
        replacement: windows-server
      - target_label: __address__
        replacement: blackbox-exporter-0-2:9115


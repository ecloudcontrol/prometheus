global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    datacenter: primary

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alert-manager-0-27.alpha-prod.svc.cluster.local:9093

rule_files:
  - /opt/bitnami/prometheus/conf/rules.yaml
  - /opt/bitnami/prometheus/conf/alerts.yaml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets:
          - '192.168.143.9:9100'
          - '192.168.141.200:9100'
          - '192.168.142.145:9100'
          - '192.168.145.176:9100'
          - '192.168.210.94:9100'
          - '192.168.175.162:9100'
          - '192.168.138.132:9100'
          - '192.168.147.6:9100'
          - '192.168.212.176:9100'
          - '172.233.218.178:9100'
          - '192.168.157.157:9100'
    metric_relabel_configs:
      - source_labels: ['nodename']
        regex: '(vv.master)'
        target_label: nodename
        replacement: vv-${1}
      - source_labels: ['nodename']
        regex: 'vv.worker.node.(.*)'
        target_label: nodename
        replacement: vv-${1}

  - job_name: 'kube-state-metrics'
    static_configs:
      - targets: ['kube-state-metrics.kube-system.svc.cluster.local:8080']

  - job_name: 'clickhouse'
    static_configs:
      - targets:
          - 'clickhousecluster-25-6-0.clickhousecluster-25-6.viralvue-prod.svc.cluster.local:9363'
          - 'clickhousecluster-25-6-1.clickhousecluster-25-6.viralvue-prod.svc.cluster.local:9363'
          - 'clickhousecluster-25-6-2.clickhousecluster-25-6.viralvue-prod.svc.cluster.local:9363'
          - 'clickhousecluster-25-6-3.clickhousecluster-25-6.viralvue-prod.svc.cluster.local:9363'
          - 'clickhousecluster-25-6-4.clickhousecluster-25-6.viralvue-prod.svc.cluster.local:9363'
          - 'clickhousecluster-25-6-5.clickhousecluster-25-6.viralvue-prod.svc.cluster.local:9363'
          - 'clickhousecluster-25-6-6.clickhousecluster-25-6.viralvue-prod.svc.cluster.local:9363'
          - 'clickhousecluster-25-6-7.clickhousecluster-25-6.viralvue-prod.svc.cluster.local:9363'
          - 'clickhousecluster-25-6-8.clickhousecluster-25-6.viralvue-prod.svc.cluster.local:9363'

  - job_name: 'kubernetes-cadvisor'
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels:
          - __meta_kubernetes_node_name
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

  - job_name: 'kubernetes-kubelet'
    scheme: https
    metrics_path: /metrics
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics

  - job_name: 'kubernetes-nodes'
    kubernetes_sd_configs:
      - role: node
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)

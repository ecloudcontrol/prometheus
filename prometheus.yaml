  - job_name: 'blackbox_prod_infra_tcp'
    scrape_interval: 15s
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - '192.168.155.101:30195'   # Alertmanager            (alert-manager-0-27)
          - '192.168.155.101:32159'   # Grafana 10.4             (grafana-10-4)
          - '192.168.155.101:32668'   # Vault (API/UI, 8200)     (vault-0-4)
          - '192.168.155.101:30515'   # Prometheus (self)        (prometheus-3-0)
          - '192.168.155.101:30246'   # Log Collector - Mongo    (appz-logcollectordb-3-1)
          - '192.168.155.101:30921'   # Log Collector - ES       (appz-logcollectores-3-1)
          - '192.168.155.101:30101'   # Log Collector - Graylog  (appz-logcollectorgl-3-1)

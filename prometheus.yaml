global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alert-manager-0-27:9093

rule_files:
  - /opt/bitnami/prometheus/conf/rules.yaml
  - /opt/bitnami/prometheus/conf/alerts.yaml

scrape_configs:

  ####################################
  # PROMETHEUS SELF SCRAPE
  ####################################
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']


  ####################################
  # NODE EXPORTERS WITH CUSTOM NAMES
  ####################################
  - job_name: 'node-exporter'
    static_configs:
      - targets:
          - 192.168.144.198:9100
          - 192.168.144.151:9100
          - 172.233.193.238:9100
          - 192.168.181.210:9100
          - 172.233.197.223:9100
          - 192.168.1.5:9100
    relabel_configs:
      - source_labels: [__address__]
        regex: 192.168.144.198:9100
        target_label: nodename
        replacement: Ti-preprod-worker-0
      - source_labels: [__address__]
        regex: 192.168.144.151:9100
        target_label: nodename
        replacement: Ti-preprod-worker-1
      - source_labels: [__address__]
        regex: 172.233.197.223:9100
        target_label: nodename
        replacement: VPN-Server-Preprod
      - source_labels: [__address__]
        regex: 172.233.193.238:9100
        target_label: nodename
        replacement: engine-master
      - source_labels: [__address__]
        regex: 192.168.181.210:9100
        target_label: nodename
        replacement: Ti-preprod-worker-2
      - source_labels: [__address__]
        regex: 192.168.1.5:9100
        target_label: nodename
        replacement: engine-master-0

  ####################################
  # KUBE STATE METRICS
  ####################################
  - job_name: 'kube-state-metrics'
    static_configs:
      - targets: ['kube-state-metrics.kube-system.svc.cluster.local:8080']

  ####################################
  # KUBERNETES CADVISOR
  ####################################
  - job_name: 'kubernetes-cadvisor'
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

  ####################################
  # KUBERNETES KUBELET
  ####################################
  - job_name: 'kubernetes-kubelet'
    scheme: https
    metrics_path: /metrics
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics

  ####################################
  # KAFKA EXPORTER
  ####################################
  - job_name: 'kafka-exporter'
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_run]
        regex: kafka-cluster-4-0
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        regex: "9308"
        action: keep
      - source_labels: [__meta_kubernetes_pod_ip]
        target_label: __address__
        replacement: ${1}:9308
        action: replace
      - target_label: component
        replacement: kafka

  ####################################
  # KAFKA JMX
  ####################################
  - job_name: 'kafka_jmx'
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
    - source_labels: [__meta_kubernetes_pod_label_run]
      regex: kafka-cluster-4-0
      action: keep
    - source_labels: [__meta_kubernetes_pod_container_port_number]
      regex: "9404"
      action: keep
    - source_labels: [__meta_kubernetes_pod_ip]
      target_label: __address__
      replacement: ${1}:9404
      action: replace
    - target_label: component
      replacement: kafka-jmx

  ####################################
  # MYSQL SLAVE EXPORTER (mysql-slave-8-1)
  ####################################
  - job_name: 'mysql-slave-exporter'
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
    - source_labels: [__meta_kubernetes_pod_label_run]
      regex: mysql-slave-8-1
      action: keep
    - source_labels: [__meta_kubernetes_pod_container_port_number]
      regex: "9104"
      action: keep
    - source_labels: [__meta_kubernetes_pod_ip]
      target_label: __address__
      replacement: ${1}:9104
      action: replace
    - target_label: slave_id
      replacement: mysql-slave-8-1
    - target_label: instance
      replacement: mysql-slave-8-1
    - target_label: role
      replacement: slave
    - target_label: db_engine
      replacement: mysql

  ####################################
  # MARIADB MASTER EXPORTER
  ####################################
  - job_name: 'mariadb-master-exporter'
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
    - source_labels: [__meta_kubernetes_pod_label_run]
      regex: mariadb-master-chart-10-11
      action: keep
    - source_labels: [__meta_kubernetes_pod_container_port_number]
      regex: "9104"
      action: keep
    - source_labels: [__meta_kubernetes_pod_ip]
      target_label: __address__
      replacement: ${1}:9104
      action: replace
    - target_label: instance
      replacement: mariadb-master
    - target_label: role
      replacement: master
    - target_label: db_engine
      replacement: mariadb

  ####################################
  # MARIADB SLAVE EXPORTER (mariadb-slave)
  ####################################
  - job_name: 'mariadb-slave-exporter'
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
    - source_labels: [__meta_kubernetes_pod_label_run]
      regex: mariadb-slave-chart-10-11
      action: keep
    - source_labels: [__meta_kubernetes_pod_container_port_number]
      regex: "9104"
      action: keep
    - source_labels: [__meta_kubernetes_pod_ip]
      target_label: __address__
      replacement: ${1}:9104
      action: replace
    - target_label: slave_id
      replacement: mariadb-slave
    - target_label: instance
      replacement: mariadb-slave
    - target_label: role
      replacement: slave
    - target_label: db_engine
      replacement: mariadb

  ####################################
  # DB HEALTHCHECK
  ####################################
  - job_name: 'app_db_health'
    scrape_interval: 15s
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['mysql-healthcheck-3-11:5000/health/db']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter-0-2:9115

  ####################################
  # KUBERNETES NODE DISCOVERY
  ####################################
  - job_name: 'kubernetes-nodes'
    kubernetes_sd_configs:
      - role: node
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)

  - job_name: 'windows_server'
    metrics_path: /metrics
    static_configs:
    - targets: ['192.168.1.2:9182']
      labels:
        instance: 'windows-server'

  - job_name: 'windows_rdp_tcp_check'
    scrape_interval: 15s
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - '192.168.1.2:3389'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
        replacement: windows-server
      - target_label: __address__
        replacement: blackbox-exporter-0-2:9115

  - job_name: 'windows_exporter_http_check'
    scrape_interval: 15s
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - 'http://192.168.1.2:9182/metrics'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
        replacement: windows-server
      - target_label: __address__
        replacement: blackbox-exporter-0-2:9115

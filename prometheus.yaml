global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alert-manager-0-27:9093

rule_files:
  - /opt/bitnami/prometheus/conf/rules.yaml
  - /opt/bitnami/prometheus/conf/alerts.yaml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets:
          - 192.168.130.209:9100
          - 192.168.176.48:9100
          - 192.168.135.67:9100
          - 192.168.135.69:9100
          - 172.234.144.12:9100
          - 192.168.135.53:9100
          - 172.234.136.73:9100
          - 192.168.175.224:9100
          - 192.168.168.69:9100
          - 192.168.168.198:9100
          - 192.168.168.210:9100
          - 192.168.168.177:9100
          - 192.168.181.54:9100
          - 192.168.181.81:9100
          - 192.168.181.73:9100
          - 192.168.130.169:9100
          - 192.168.148.11:9100
          - 192.168.140.249:9100
          - 192.168.140.248:9100
    relabel_configs:
      - source_labels: [__address__]
        regex: 192.168.130.209:9100
        target_label: nodename
        replacement: Ti-prod-worker-0
      - source_labels: [__address__]
        regex: 192.168.176.48:9100
        target_label: nodename
        replacement: Ti-prod-worker-1
      - source_labels: [__address__]
        regex: 192.168.135.67:9100
        target_label: nodename
        replacement: Ti-prod-worker-2
      - source_labels: [__address__]
        regex: 192.168.135.69:9100
        target_label: nodename
        replacement: Ti-prod-worker-3
      - source_labels: [__address__]
        regex: 172.234.144.12:9100
        target_label: nodename
        replacement: prod-engine-master
      - source_labels: [__address__]
        regex: 192.168.135.53:9100
        target_label: nodename
        replacement: Ti-prod-worker-4
      - source_labels: [__address__]
        regex: 172.234.136.73:9100
        target_label: nodename
        replacement: VPN-Server-Prod
      - source_labels: [__address__]
        regex: 192.168.175.224:9100
        target_label: nodename
        replacement: mysql-prod-node-0
      - source_labels: [__address__]
        regex: 192.168.168.69:9100
        target_label: nodename
        replacement: kafka-node-0 
      - source_labels: [__address__]
        regex: 192.168.168.198:9100
        target_label: nodename
        replacement: kafka-node-1  
      - source_labels: [__address__]
        regex: 192.168.168.210:9100
        target_label: nodename
        replacement: kafka-node-2
      - source_labels: [__address__]
        regex: 192.168.181.54:9100
        target_label: nodename
        replacement: chart-app-node-0
      - source_labels: [__address__]
        regex: 192.168.181.81:9100
        target_label: nodename
        replacement: chart-app-node-1
      - source_labels: [__address__]
        regex: 192.168.181.73:9100
        target_label: nodename
        replacement: chart-app-node-2
      - source_labels: [__address__]
        regex: 192.168.168.177:9100
        target_label: nodename
        replacement: MariaDB-node-0
      - source_labels: [__address__]
        regex: 192.168.130.169:9100
        target_label: nodename
        replacement: MariaDB-node-1
      - source_labels: [__address__]
        regex: 192.168.148.11:9100
        target_label: nodename
        replacement: Ti-prod-worker-5
      - source_labels: [__address__]
        regex: 192.168.140.248:9100
        target_label: nodename
        replacement: Ti-prod-worker-6
      - source_labels: [__address__]
        regex: 192.168.140.249:9100
        target_label: nodename
        replacement: Ti-prod-worker-7
      
      
  - job_name: 'kube-state-metrics'
    static_configs:
      - targets: ['kube-state-metrics.kube-system.svc.cluster.local:8080']

  - job_name: 'kubernetes-cadvisor'
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

  - job_name: 'kubernetes-kubelet'
    scheme: https
    metrics_path: /metrics
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics

  - job_name: 'windows_server'
    metrics_path: /metrics
    static_configs:
    - targets: ['192.168.1.7:9182']
      labels:
        instance: 'windows-server'

  - job_name: 'kafka-exporter'
    kubernetes_sd_configs:
    - role: pod
    relabel_configs:
    - source_labels: [__meta_kubernetes_pod_label_run]
      regex: kafka-cluster-4-0
      action: keep
    - source_labels: [__meta_kubernetes_pod_container_port_number]
      regex: "9308"
      action: keep
    - source_labels: [__meta_kubernetes_pod_ip]
      target_label: __address__
      replacement: ${1}:9308
      action: replace
    - target_label: component
      replacement: kafka
 
  - job_name: 'kafka_jmx'
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
    - source_labels: [__meta_kubernetes_pod_label_run]
      regex: kafka-cluster-4-0
      action: keep
    - source_labels: [__meta_kubernetes_pod_container_port_number]
      regex: "9404"
      action: keep
    - source_labels: [__meta_kubernetes_pod_ip]
      target_label: __address__
      replacement: ${1}:9404
      action: replace
    - target_label: component
      replacement: kafka-jmx

  - job_name: 'mariadb-master-exporter'
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
    - source_labels: [__meta_kubernetes_pod_label_run]
      regex: mariadb-master-chart-10-11
      action: keep
    - source_labels: [__meta_kubernetes_pod_container_port_number]
      regex: "9104"
      action: keep
    - source_labels: [__meta_kubernetes_pod_ip]
      target_label: __address__
      replacement: ${1}:9104
      action: replace
    - target_label: instance
      replacement: mariadb-master
    - target_label: role
      replacement: master

  - job_name: 'mariadb-slave-exporter'
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
    - source_labels: [__meta_kubernetes_pod_label_run]
      regex: mariadb-slave-chart-10-11
      action: keep
    - source_labels: [__meta_kubernetes_pod_container_port_number]
      regex: "9104"
      action: keep
    - source_labels: [__meta_kubernetes_pod_ip]
      target_label: __address__
      replacement: ${1}:9104
      action: replace
    - target_label: slave_id
      replacement: mariadb-slave-10-11
    - target_label: instance
      replacement: mariadb-slave-10-11
    - target_label: role
      replacement: slave
  
  - job_name: 'mysql_slave'
    metrics_path: /metrics
    static_configs:
      - targets: ['10.2.2.139:9104']
        labels:
          role: slave  

  - job_name: 'app_db_health'
    scrape_interval: 15s
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['mysql-healthcheck-3-11:5000/health/db']

    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter-0-2:9115

  - job_name: 'tcp_connect_check'
    scrape_interval: 15s
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: ['192.168.130.209:31192']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter-0-2:9115

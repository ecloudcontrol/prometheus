global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alert-manager-0-28:9093

rule_files:
  - /opt/bitnami/prometheus/conf/rules.yaml
  - /opt/bitnami/prometheus/conf/alerts.yaml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets:
          - 192.168.192.138:9100
          - 192.168.136.9:9100
          - 192.168.136.43:9100
        labels:
          cluster: Plantmaster-PROD
      - targets:
          - 192.168.198.61:9100
        labels:
          cluster: Plantmaster-DEV
      - targets:
          - 192.168.208.168:9100
        labels:
          cluster: Plantmaster-cloudorbit-master
    relabel_configs:
      - source_labels: [__address__]
        regex: 192.168.198.61:9100
        target_label: nodename
        replacement: PM-dev-node-0
      - source_labels: [__address__]
        regex: 192.168.192.138:9100
        target_label: nodename
        replacement: PM-prod-node-0
      - source_labels: [__address__]
        regex: 192.168.136.9:9100
        target_label: nodename
        replacement: PM-prod-node-1
      - source_labels: [__address__]
        regex: 192.168.136.43:9100
        target_label: nodename
        replacement: PM-prod-node-2
      - source_labels: [__address__]
        regex: 192.168.208.168:9100
        target_label: nodename
        replacement: cloudorbit-master

  - job_name: 'kube-state-metrics'
    static_configs:
      - targets: ['192.168.192.138:30000']
        labels:
          cluster: Plantmaster-PROD
      - targets: ['192.168.198.61:30000']
        labels:
          cluster: Plantmaster-DEV

  - job_name: 'kubernetes-cadvisor'
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

  - job_name: 'kubernetes-kubelet'
    scheme: https
    metrics_path: /metrics
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics

  - job_name: 'pm-prod-cadvisor'
    scheme: https
    metrics_path: /metrics/cadvisor
    tls_config:
      insecure_skip_verify: true
    authorization:
      credentials_file: /appz/data/lke/pm-prod-token
    static_configs:
      - targets: ['192.168.192.138:10250', '192.168.136.9:10250', '192.168.136.43:10250']
        labels:
          cluster: Plantmaster-PROD

  - job_name: 'pm-dev-cadvisor'
    scheme: https
    metrics_path: /metrics/cadvisor
    tls_config:
      insecure_skip_verify: true
    authorization:
      credentials_file: /appz/data/lke/pm-dev-token
    static_configs:
      - targets: ['192.168.198.61:10250']
        labels:
          cluster: Plantmaster-DEV

  - job_name: 'pm-prod-kubelet'
    scheme: https
    metrics_path: /metrics
    tls_config:
      insecure_skip_verify: true
    authorization:
      credentials_file: /appz/data/lke/pm-prod-token
    static_configs:
      - targets: ['192.168.192.138:10250', '192.168.136.9:10250', '192.168.136.43:10250']
        labels:
          cluster: Plantmaster-PROD

  - job_name: 'pm-dev-kubelet'
    scheme: https
    metrics_path: /metrics
    tls_config:
      insecure_skip_verify: true
    authorization:
      credentials_file: /appz/data/lke/pm-dev-token
    static_configs:
      - targets: ['192.168.198.61:10250']
        labels:
  - job_name: 'mariadb-master-exporter'
    static_configs:
      - targets: ['192.168.192.138:30214']
        labels: { cluster: Plantmaster-PROD, role: master, instance: pm-prod-mariadb-master }
      - targets: ['192.168.198.61:30685']
        labels: { cluster: Plantmaster-DEV, role: master, instance: pm-dev-mariadb-master }

  - job_name: 'mariadb-slave-exporter'
    static_configs:
      - targets: ['192.168.192.138:31385']
        labels: { cluster: Plantmaster-PROD, role: slave, instance: pm-prod-mariadb-slaves }
      - targets: ['192.168.198.61:31490']
        labels: { cluster: Plantmaster-DEV, role: slave, instance: pm-dev-mariadb-slave-0 }

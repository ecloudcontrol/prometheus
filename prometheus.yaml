global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
  - static_configs:
    - targets:
       - alert-manager-0-27:9093

rule_files:
   - /opt/bitnami/prometheus/conf/rules.yaml
   - /opt/bitnami/prometheus/conf/alerts.yaml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
    - targets: ['localhost:9090']
  
  - job_name: 'node-exporter'
    static_configs:
    - targets: ['172.16.70.4:9100']
    metric_relabel_configs:
      - source_labels: ['nodename']
        regex: '(engine.master)'
        target_label: nodename
        replacement: appz-${1}
      - source_labels: ['nodename']
        regex: 'k8s.worker.node.(.*)'
        target_label: nodename
        replacement: appz-dev-worker-${1}
  
  - job_name: 'kube-state-metrics'
    static_configs:
    - targets: ['kube-state-metrics.kube-system.svc.cluster.local:8080']
    
  - job_name: 'windows_server'
    metrics_path: /metrics
    static_configs:
    - targets: ['172.16.40.20:9182']
      labels:
        instance: 'UnityTest01'
    - targets: ['172.16.2.8:9182']
      labels:
        instance: 'UnityDC2'
    - targets: ['10.5.1.4:9182']
      labels:
        instance: 'UNITYSQLSVR003'
    - targets: ['172.16.30.12:9182']
      labels:
        instance: 'UNITYSQLSVR002'
    - targets: ['172.16.10.26:9182']
      labels:
        instance: 'UNITYWEB02'
    - targets: ['172.16.30.11:9182']
      labels:
        instance: 'UNITYSQLSVR001'
    - targets: ['172.16.10.20:9182']
      labels:
        instance: 'UNITYWEB01'
    - targets: ['172.16.40.10:9182']
      labels:
        instance: 'UnityOps01'
    - targets: ['172.16.20.4:9182']
      labels:
        instance: 'EZD01'
    - targets: ['172.16.2.6:9182']
      labels:
        instance: 'UnityDC'
    - targets: ['10.50.0.5:9182']
      labels:
        instance: 'PAN-ACTIVE-0'
    - targets: ['10.50.1.4:9182']
      labels:
        instance: 'PAN-CLIENT-0'
    - targets: ['172.16.40.6:9182']
      labels:
        instance: 'UnityTest02'
    - targets: ['10.10.33.4:9182']
      labels:
        instance: 'UNITYPROC01'

  - job_name: 'windows_servers_up'
    scrape_interval: 15s
    metrics_path: /probe
    params:
      module: [icmp]
    static_configs:
      - targets:
          - '172.16.40.20'    # UnityTest01
          - '172.16.2.8'      # UnityDC2
          - '10.5.1.4'        # UNITYSQLSVR003
          - '172.16.30.12'    # UNITYSQLSVR002
          - '172.16.10.26'    # UNITYWEB02
          - '172.16.30.11'    # UNITYSQLSVR001
          - '172.16.10.20'    # UNITYWEB01
          - '172.16.40.10'    # UnityOps01
          - '172.16.20.4'     # EZD01
          - '172.16.2.6'      # UnityDC
          - '10.50.0.5'       # PAN-ACTIVE-0
          - '10.50.1.4'       # PAN-CLIENT-0
          - '172.16.40.6'     # UnityTest02
          - '10.10.33.4'      # UNITYPROC01
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter-0-2:9115
  
  - job_name: 'kubernetes-cadvisor'
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
    - role: node
    relabel_configs:
    - action: labelmap
      regex: __meta_kubernetes_node_label_(.+)
    - target_label: __address__
      replacement: kubernetes.default.svc:443
    - source_labels: [__meta_kubernetes_node_name]
      regex: (.+)
      target_label: __metrics_path__
      replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
  - job_name: 'blackbox'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://unityfisolutions.com/
          - https://ach.sandtechnologygroup.com/
          - https://portal.checxchange.com/
          - https://goach.com/
          - https://mca-track.com/
          - https://www.gobeepay.com/
          - https://unity.sandtechnologygroup.com/
          - https://sedatabeta.easydraft.com/
          - https://api.sandtechnologygroup.com/AccountServices/swagger/ui/index
          - https://services.easydraft.com/accountservices/swagger
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter-0-2:9115

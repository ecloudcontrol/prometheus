global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    datacenter: primary

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alert-manager-0-2.alpha-prod.svc.cluster.local:9093

rule_files:
  - /opt/bitnami/prometheus/conf/rules.yaml
  - /opt/bitnami/prometheus/conf/alerts.yaml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets:
          - '10.0.0.3:9100'
          - '192.168.195.202:9100'
          - '192.168.195.229:9100'
          - '192.168.180.43:9100'
          - '192.168.168.83:9100'
          - '192.168.180.82:9100'
          - '192.168.132.38:9100'
          - '192.168.132.158:9100'
          - '192.168.163.152:9100'
          - '192.168.130.13:9100'
          - '192.168.130.186:9100'
          - '192.168.184.112:9100'
          - '192.168.130.89:9100'
          - '192.168.130.115:9100'
          - '192.168.170.62:9100'
          - '192.168.130.226:9100'
          - '192.168.184.105:9100'
          - '192.168.184.245:9100'
          - '192.168.158.214:9100'
          - '192.168.133.166:9100'
          - '192.168.167.33:9100'
          - '192.168.130.243:9100'
          - '192.168.199.203:9100'
          - '192.168.150.194:9100'
          - '192.168.151.129:9100'
          - '192.168.142.204:9100'
          - '192.168.142.34:9100'
          - '192.168.143.147:9100'
          - '192.168.135.192:9100'
    metric_relabel_configs:
      - source_labels: ['nodename']
        regex: '(vv.master)'
        target_label: nodename
        replacement: vv-${1}
      - source_labels: ['nodename']
        regex: 'vv.worker.node.(.*)'
        target_label: nodename
        replacement: vv-${1}

  - job_name: 'kube-state-metrics'
    static_configs:
      - targets: ['kube-state-metrics.kube-system.svc.cluster.local:8080']

  - job_name: 'clickhouse'
    static_configs:
      - targets:
          - 'clickhousecluster-25-6-0.clickhousecluster-25-6.vv-prod.svc.cluster.local:9363'
          - 'clickhousecluster-25-6-1.clickhousecluster-25-6.vv-prod.svc.cluster.local:9363'
          - 'clickhousecluster-25-6-2.clickhousecluster-25-6.vv-prod.svc.cluster.local:9363'

  - job_name: 'kubernetes-cadvisor'
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels:
          - __meta_kubernetes_node_name
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

  - job_name: 'kubernetes-nodes'
    kubernetes_sd_configs:
      - role: node
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)

global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alert-manager-0-27:9093

rule_files:
  - /opt/bitnami/prometheus/conf/rules.yaml
  - /opt/bitnami/prometheus/conf/alerts.yaml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets:
          - 192.168.155.101:9100
          - 192.168.151.227:9100
          - 192.168.144.216:9100
          - 172.234.144.12:9100
          - 172.234.136.73:9100
          - 192.168.176.96:9100
          - 192.168.131.158:9100
          - 192.168.131.175:9100
          - 192.168.131.180:9100
          - 192.168.171.196:9100
          - 192.168.129.186:9100
          - 192.168.183.33:9100
          - 192.168.171.230:9100
          - 192.168.162.187:9100
          - 192.168.169.82:9100
          - 192.168.157.212:9100
          - 192.168.129.173:9100
          - 192.168.147.133:9100
          - 192.168.183.13:9100
          - 192.168.129.112:9100
          - 192.168.183.131:9100
          - 192.168.129.249:9100
          - 192.168.154.187:9100
          - 192.168.164.213:9100
          - 192.168.129.98:9100
          - 192.168.1.142:9100
    relabel_configs:
      - source_labels: [__address__]
        regex: 192.168.155.101:9100
        target_label: nodename
        replacement: Ti-prod-worker-0
      - source_labels: [__address__]
        regex: 192.168.151.227:9100
        target_label: nodename
        replacement: Ti-prod-worker-1
      - source_labels: [__address__]
        regex: 192.168.144.216:9100
        target_label: nodename
        replacement: Ti-prod-worker-2
      - source_labels: [__address__]
        regex: 172.234.144.12:9100
        target_label: nodename
        replacement: prod-engine-master
      - source_labels: [__address__]
        regex: 172.234.136.73:9100
        target_label: nodename
        replacement: VPN-Server-Prod
      - source_labels: [__address__]
        regex: 192.168.176.96:9100
        target_label: nodename
        replacement: mysql-prod-node-0
      - source_labels: [__address__]
        regex: 192.168.131.158:9100
        target_label: nodename
        replacement: kafka-node-0
      - source_labels: [__address__]
        regex: 192.168.131.175:9100
        target_label: nodename
        replacement: kafka-node-1
      - source_labels: [__address__]
        regex: 192.168.131.180:9100
        target_label: nodename
        replacement: kafka-node-2
      - source_labels: [__address__]
        regex: 192.168.183.13:9100
        target_label: nodename
        replacement: chart-app-node-0
      - source_labels: [__address__]
        regex: 192.168.129.186:9100
        target_label: nodename
        replacement: chart-app-node-1
      - source_labels: [__address__]
        regex: 192.168.183.33:9100
        target_label: nodename
        replacement: chart-app-node-2
      - source_labels: [__address__]
        regex: 192.168.183.131:9100
        target_label: nodename
        replacement: chart-app-node-3
      - source_labels: [__address__]

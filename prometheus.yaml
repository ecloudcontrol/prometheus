        target_label: nodename
        replacement: wordpress-node-0
      - source_labels: [__address__]
        regex: 192.168.129.98:9100
        target_label: nodename
        replacement: mysql-slave-replica-3
      - source_labels: [__address__]
        regex: 192.168.1.142:9100
        target_label: nodename
        replacement: real-time-server-node

  - job_name: 'kube-state-metrics'
    static_configs:
      - targets: ['kube-state-metrics.kube-system.svc.cluster.local:8080']

  - job_name: 'kubernetes-cadvisor'
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

  - job_name: 'kubernetes-kubelet'
    scheme: https
    metrics_path: /metrics
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics

  - job_name: 'windows_server'
    metrics_path: /metrics
    static_configs:
    - targets: ['172.239.142.27:9182']
      labels:
        instance: 'windows-server'

  - job_name: 'kafka-exporter'
    kubernetes_sd_configs:
    - role: pod
    relabel_configs:
    - source_labels: [__meta_kubernetes_pod_label_run]
      regex: kafka-cluster-4-0
      action: keep
    - source_labels: [__meta_kubernetes_pod_container_port_number]
      regex: "9308"
      action: keep
    - source_labels: [__meta_kubernetes_pod_ip]
      target_label: __address__
      replacement: ${1}:9308
      action: replace
    - target_label: component
      replacement: kafka

  - job_name: 'kafka_jmx'
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
    - source_labels: [__meta_kubernetes_pod_label_run]
      regex: kafka-cluster-4-0
      action: keep
    - source_labels: [__meta_kubernetes_pod_container_port_number]
      regex: "9404"
      action: keep
    - source_labels: [__meta_kubernetes_pod_ip]
      target_label: __address__
      replacement: ${1}:9404
      action: replace
    - target_label: component
      replacement: kafka-jmx

  - job_name: 'mariadb-master-exporter'
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
    - source_labels: [__meta_kubernetes_pod_label_run]
      regex: mariadb-master-chart-10-11
      action: keep
    - source_labels: [__meta_kubernetes_pod_container_port_number]
      regex: "9104"
      action: keep
    - source_labels: [__meta_kubernetes_pod_ip]
      target_label: __address__
      replacement: ${1}:9104
      action: replace
    - target_label: instance
      replacement: mariadb-master
    - target_label: role
      replacement: master
    - target_label: db_engine
      replacement: mariadb

  - job_name: 'mariadb-slave-exporter'
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
    - source_labels: [__meta_kubernetes_pod_label_run]
      regex: mariadb-slave-chart-10-11
      action: keep
    - source_labels: [__meta_kubernetes_pod_container_port_number]
      regex: "9104"
      action: keep
    - source_labels: [__meta_kubernetes_pod_ip]
